# Build, smoke-test and publish the package. Free GitHub-hosted runners only.
#   push a tag vX.Y.Z  -> build, smoke test on Linux/macOS/Windows, publish to PyPI
#   run manually       -> build, smoke test, publish to TestPyPI
# Publishing uses PyPI trusted publishing (no stored token): see docs/releasing.md for the one-time setup.
name: publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: build the sdist and the wheel
        run: |
          python -m pip install --upgrade build "twine>=6" "readme_renderer[md]"
          python -m build
          python -m twine check --strict dist/*
      - name: the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: test -f "dist/miraw-${GITHUB_REF_NAME#v}-py3-none-any.whl"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4  # only for scripts/smoke_installed.py; miraw itself comes from the wheel
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: install the wheel in a clean environment (CPU PyTorch)
        shell: bash
        run: |
          if [ "$RUNNER_OS" != "macOS" ]; then pip install torch --index-url https://download.pytorch.org/whl/cpu; fi
          pip install dist/*.whl
      - name: smoke test
        shell: bash
        run: |
          miraw --help
          python scripts/smoke_installed.py
          # Linux forks its worker processes; also test spawned ones (the macOS and Windows default)
          if [ "$RUNNER_OS" = "Linux" ]; then python scripts/smoke_installed.py --spawn; fi

  testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: [build, smoke]
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true  # rerunning with an unchanged version is not an error on TestPyPI

  pypi:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, smoke]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

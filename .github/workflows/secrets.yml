# Server-side safety net for commits made without the local hooks (other clones, --no-verify).
name: secrets

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for gitleaks

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: pre-commit hooks on all tracked files
        run: |
          pip install pre-commit
          pre-commit run --all-files --show-diff-on-failure

      - name: gitleaks on full git history
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz gitleaks
          ./gitleaks git --redact --verbose .

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pymiraw"
version = "0.2.0"
description = "Python/PyTorch reimplementation of miRAW (Pla et al., PLoS Comput Biol 2018)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
# Everything needed to predict (original weights bundled) and to train. ViennaRNA 2.7.x is the default
# folding backend (the gates were run with 2.7.2); other versions can be used through `backend="cli"`.
dependencies = [
  "numpy", "pandas", "pyarrow", "scikit-learn", "scipy", "torch", "lightning>=2.4", "ViennaRNA>=2.7.2,<2.8",
  "pydantic>=2", "pyyaml", "typer", "tqdm",
]

[project.optional-dependencies]
data = ["py7zr", "xlrd", "fsspec", "s3fs"]  # paper archive unpacking, GlobalSummary.xls, the project S3 mirror
notebook = ["jupyterlab", "matplotlib"]
dev = ["pytest", "pytest-cov", "pytest-xdist", "hypothesis", "ruff", "mypy", "nbformat", "nbclient", "ipykernel"]

[project.scripts]
pymiraw = "pymiraw.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/pymiraw"]  # includes src/pymiraw/resources (weights, reference tables, examples)

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
  "ignore:.*treespec.*",
  "ignore:.*does not have many workers.*",
  "ignore:.*multi-threaded, use of fork.*:DeprecationWarning",
  "ignore:.*xlrd engine.*",
]
pythonpath = ["src"]
markers = [
  "slow: long-running tests",
  "s3: needs S3 access",
  "reference: needs the Java oracle environment",
  "acceptance: full benchmark runs",
  "data: needs the released miRAW data (pymiraw data pull)",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/pymiraw/cli.py" = ["B008"]
"scripts/*_report.py" = ["E501"]
"scripts/gene_level_compare.py" = ["E501"]
"scripts/viennarna_version_check.py" = ["E501"]
"scripts/build_tutorial_notebook.py" = ["E501"]  # notebook prose

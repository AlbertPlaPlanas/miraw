[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pymiraw"
version = "0.1.0"
description = "Python/PyTorch reimplementation of miRAW (Pla et al., PLoS Comput Biol 2018)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
dependencies = [
  "numpy", "pandas", "pyarrow", "scikit-learn", "scipy", "torch",
  "pydantic>=2", "pyyaml", "typer", "rich", "tqdm", "fsspec", "s3fs",
]

[project.optional-dependencies]
train = ["lightning>=2.4"]
dev = ["pytest", "pytest-cov", "pytest-xdist", "hypothesis", "ruff", "mypy"]

[project.scripts]
pymiraw = "pymiraw.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/pymiraw"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]
markers = [
  "slow: long-running tests",
  "s3: needs S3 access",
  "reference: needs the Java oracle environment",
  "acceptance: full benchmark runs",
  "data: needs the released miRAW data (pymiraw data pull)",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/pymiraw/cli.py" = ["B008"]
"scripts/*_report.py" = ["E501"]
"scripts/gene_level_compare.py" = ["E501"]

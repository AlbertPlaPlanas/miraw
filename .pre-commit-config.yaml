# Secret and data guards. Install once per clone:  pre-commit install
# Run manually on everything:                       pre-commit run --all-files
repos:
  - repo: local
    hooks:
      - id: check-secrets
        name: block secrets (credential files, local .secrets.md values, key patterns)
        entry: python scripts/check_secrets.py
        language: python
        types: [file]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: detect-private-key
      - id: detect-aws-credentials
        args: [--allow-missing-credentials]
      - id: check-added-large-files  # heavy data belongs in S3, not git
        args: [--maxkb=1024]
